apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sports-nexus
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/prasannakumaryendluri-45/sports-nexus-gitops.git
    targetRevision: main
    path: dev

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
