apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sports-nexus-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/prasannakumaryendluri-45/sports-nexus-helm.git
    targetRevision: main
    path: sports-nexus

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
